name: Eval gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  smoke-eval:
    name: 30-job smoke eval with thresholds
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_OFFLINE: ${{ secrets.GROQ_API_KEY == '' && '1' || '0' }}
      MCP_TRANSPORT: memory
      GIGSIM_INPROCESS: "1"
      GIGSIM_ERROR_RATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Smoke eval (fails if unsupported claims rise or bid/skip F1 drops past evals/thresholds.yaml)
        run: .venv/bin/python -m evals.runners.smoke --jobs 30
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: smoke-eval, path: evals/results/smoke_latest.json}
