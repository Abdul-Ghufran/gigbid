# GigBid runtime configuration.  Every node's model, every budget, threshold and platform rule
# lives here (or in agent/prompts/ and data/policy_pack/) - never in Python code.
version: 3

marketplace:
  mode: gigsim            # gigsim | upwork_live   (env MARKETPLACE_MODE overrides)
  max_requests_per_minute: 40   # GigSim allows 60/min/token; we stay well under
  live_min_search_interval_minutes: 30
  scout_interval_minutes: {gigsim: 20, upwork_live: 180}

# ------------------------------------------------------------------------------------- models
# provider: groq | openrouter | ollama | openai.  Prices are USD per 1M tokens at the provider's
# paid list price (the free tier we deploy on bills $0; we report list-price cost so budgets are honest).
providers:
  groq: {base_url: "https://api.groq.com/openai/v1", key_env: GROQ_API_KEY}
  openrouter: {base_url: "https://openrouter.ai/api/v1", key_env: OPENROUTER_API_KEY}
  ollama: {base_url_env: OLLAMA_BASE_URL, key_env: null}
  openai: {base_url: "https://api.openai.com/v1", key_env: OPENAI_API_KEY}

models:
  small:   {provider: groq, model: "openai/gpt-oss-20b", price_in: 0.075, price_out: 0.30, rpm: 30, tpm: 8000, reasoning_effort: low}
  mid:     {provider: groq, model: "openai/gpt-oss-20b", price_in: 0.075, price_out: 0.30, rpm: 30, tpm: 8000, reasoning_effort: medium}
  strong:  {provider: groq, model: "openai/gpt-oss-120b", price_in: 0.15, price_out: 0.60, rpm: 30, tpm: 8000, reasoning_effort: low}
  qwen:    {provider: groq, model: "qwen/qwen3.8-27b", price_in: 0.29, price_out: 0.59, rpm: 2, tpm: 6000, max_output: 950, reasoning_effort: none}  # Groq caps Qwen at 1000 output tokens/min
  guard:   {provider: groq, model: "meta-llama/llama-prompt-guard-2-86m", price_in: 0.04, price_out: 0.04, rpm: 30, tpm: 15000}
  local_small: {provider: ollama, model: "qwen3:4b", price_in: 0, price_out: 0}
  local_mid:   {provider: ollama, model: "gpt-oss:20b", price_in: 0, price_out: 0}
  paid_strong: {provider: openai, model: "gpt-4.1-mini", price_in: 0.40, price_out: 1.60}

profiles:
  open:            # REQUIRED: open-weight models only (hosted on Groq for the deployment)
    scout: small
    analyst: mid
    risk_assessor: small
    fit_matcher: small
    pricing: small
    writer: strong
    verifier: mid
    critic: strong
    compliance: small
    liaison: strong
    intent: small
    judge: strong
    rag_aux: small        # HyDE, contextual lines, query rewrites
    fallback_small: strong  # fallback for cheap nodes (C7): a different model, not a retry of the same one
    fallback_strong: qwen
  open_qwen:       # third open configuration: Qwen for the writing roles
    scout: small
    analyst: small
    risk_assessor: small
    fit_matcher: small
    pricing: small
    writer: qwen
    verifier: small
    critic: qwen
    compliance: small
    liaison: qwen
    intent: small
    judge: strong
    rag_aux: small
    fallback_small: strong
    fallback_strong: strong
  open_strong:     # every node on gpt-oss-120b: same model for all R&D C architectures; used when 20b's daily quota is spent
    scout: strong
    analyst: strong
    risk_assessor: strong
    fit_matcher: strong
    pricing: strong
    writer: strong
    verifier: strong
    critic: strong
    compliance: strong
    liaison: strong
    intent: strong
    judge: strong
    rag_aux: strong
    fallback_small: strong
    fallback_strong: strong
  eval_qwen:       # same-model setting for R&D question C (every LLM call on Qwen; separate daily quota)
    scout: qwen
    analyst: qwen
    risk_assessor: qwen
    fit_matcher: qwen
    pricing: qwen
    writer: qwen
    verifier: qwen
    critic: qwen
    compliance: qwen
    liaison: qwen
    intent: qwen
    judge: qwen
    rag_aux: qwen
    fallback_small: qwen
    fallback_strong: qwen
  open_mid:        # second open configuration compared on the dev set
    scout: small
    analyst: mid
    risk_assessor: mid
    fit_matcher: mid
    pricing: mid
    writer: mid
    verifier: mid
    critic: mid
    compliance: mid
    liaison: mid
    intent: mid
    judge: mid
    rag_aux: small
    fallback_small: small
    fallback_strong: small
  local:           # laptop / docker compose with the Ollama service
    scout: local_small
    analyst: local_small
    risk_assessor: local_small
    fit_matcher: local_small
    pricing: local_small
    writer: local_mid
    verifier: local_small
    critic: local_mid
    compliance: local_small
    liaison: local_mid
    intent: local_small
    judge: local_mid
    rag_aux: local_small
    fallback_small: local_small
    fallback_strong: local_mid
  paid:            # optional; only used where it beats `open` by enough to justify cost
    scout: small
    analyst: mid
    risk_assessor: small
    fit_matcher: small
    pricing: small
    writer: paid_strong
    verifier: mid
    critic: paid_strong
    compliance: small
    liaison: paid_strong
    intent: small
    judge: strong
    rag_aux: small
    fallback_small: mid
    fallback_strong: strong

embeddings: "BAAI/bge-small-en-v1.5"          # open, CPU (fastembed / ONNX), both profiles
reranker: "Xenova/ms-marco-MiniLM-L-6-v2"      # open cross-encoder, CPU, both profiles

llm:
  timeout_s: 45
  max_retries: 2
  temperature: 0.2
  cache: true

verification:
  semantic: bi_encoder             # cross_encoder | bi_encoder - equal F1 on verifier_eval; bi-encoder needs no reranker in RAM

# ---------------------------------------------------------------------------------------- RAG
rag:
  shipped_variant: v8_corrective   # chosen by evals/results/rag_variants.json (see docs/DATA_CARD.md)
  k: 8
  corrective:
    base: v9_skill_graph           # best retriever by evals/results/rag_variants.json
    cos_threshold: 0.83            # calibrated: evals/results/grader_calibration_v9.json (F1 0.985)
    weak_threshold: -7.1           # only used with base v3_rerank: evals/results/grader_calibration.json
    max_requeries: 1

# ------------------------------------------------------------------------------------ budgets
budgets:
  max_graph_steps: 40
  max_revisions: 2                 # Critic may send a draft back at most twice
  max_tokens_per_job: 60000        # gpt-oss counts reasoning tokens; 30k stopped live drafts with two Critic revisions
  max_tokens_per_conversation_turn: 12000
  max_auto_drafts_per_day: 8       # per user; protects the free-tier daily token cap (~12 full drafts/day on the strong model)
  declared:
    p95_latency_s_per_job_analysed: 25
    p95_latency_s_per_proposal: 90
    usd_per_job_analysed: 0.002
    usd_per_proposal: 0.01

# --------------------------------------------------------------------------------- thresholds
thresholds:
  bid_min_fit: 0.70               # evals/results/threshold_sweep.json: middle of the 0.67-0.75 plateau (F1 0.976), not the 0.80 peak (overfit risk)
  watch_min_fit: 0.35
  max_risk: 0.6
  scam_risk: 0.75
  weak_evidence_fit_cap: 0.4
  claim_support_min: 0.8           # bi-encoder cosine; evals/results/verifier_eval.json (F1 0.99, same as cross-encoder)
  claim_partial_min: 0.65
  proposal_max_words: 260
  proposal_min_words: 90
  critic_pass_score: 7

# ------------------------------------------------------------------- pricing + Connects policy
pricing:
  connects_usd_value: 0.15         # what one Connect costs to buy
  min_expected_value_ratio: 3.0    # expected value of a bid must exceed 3x its Connects cost
  base_reply_rate: 0.12
  undercut_floor_ratio: 0.85       # never quote below 85% of market p25 (signals low quality)

# Platform rules the agents enforce.  The 2 Nov 2026 change request is absorbed here.
platform_policy:
  version: "2026-11-02"           # change request: GigSim platform policy update
  policy_pack: data/policy_pack/marketplace_policy.md
  require_all_screening_answers: true
  connects:
    high_competition_threshold: 20
    high_competition_multiplier: 1.5

experiments:                        # signature extension X2 (docs/EXTENSION.md)
  ab_enabled: true                  # each job is assigned a strategy by a stable hash of its id; analytics compares them
  strategies:
    proof_first: "Structure: open with the client's problem in one sentence, then immediately the single most relevant past result with its number and citation, then your approach, then a next step."
    plan_first: "Structure: open with the client's problem in one sentence, then a concrete 3-step plan for THIS job, then the supporting past results with citations, then a next step."

memory:
  style_promotion:
    min_occurrences: 3            # same edit pattern seen in >= 3 distinct drafts
    min_distinct_jobs: 3
    window_days: 30
    max_items: 25
  outcome_promotion:
    min_proposals_per_category: 5  # need 5 outcomes in a category before a lesson is stored
    min_lift: 0.10                 # pattern must lift reply rate by >= 10 points over the category base

autonomy:
  allowed: [suggest, auto_skip_low_fit]   # auto-send is never allowed
